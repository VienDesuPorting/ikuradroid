# 1.3.0 roadmap item: automatic APK builds on every push.
#
# - build:    every push to main / PR / manual run - assembleDebug +
#             assembleRelease (release is signed with the committed
#             keystore via gradle.properties), APKs uploaded as artifacts.
# - release:  pushing a tag v* (e.g. v1.3.0) additionally creates a GitHub
#             release and attaches both APKs.
#
# The native build (9 .so via ndk-build, two ABIs) takes the bulk of the
# ~15-25 minutes; Gradle caching (setup-gradle) keeps the re-runs shorter.

name: android-build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IkuraDroid-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  release:
    name: GitHub release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: IkuraDroid-${{ github.sha }}
          path: apks

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
