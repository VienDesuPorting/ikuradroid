plugins {
    id 'com.android.application'
}

android {
    namespace 'su.viende.vile'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // 1.0.0 rebrand: applicationId moved su.viende.vile -> su.viende.ikuradroid.
        // The Java namespace above INTENTIONALLY stays su.viende.vile: the SDL JNI
        // bridge (SDL_JAVA_PACKAGE_PATH := su_viende_vile in jni/Android.mk),
        // org.libsdl.app.* references and Java package declarations all depend on
        // it. Renaming it would risk breaking the native bridge for zero benefit.
        applicationId "su.viende.ikuradroid"
        minSdk 21
        // 35 breaks the 2016-era file browser permission model less than expected:
        // WRITE_EXTERNAL_STORAGE still grants access to shared storage roots via
        // MANAGE_EXTERNAL_STORAGE below, and app-private dirs always work.
        targetSdk 35
        // Single source of truth for the version. NB: values here override
        // android:versionCode/versionName in AndroidManifest.xml — keep the
        // manifest attributes removed to avoid silent mismatches.
        // 1.0.0 restarts both versionName and the versionCode lineage: the new
        // applicationId makes it a fresh install, there is no upgrade path from
        // the 0.54.x line (su.viende.vile).
        versionCode 3
        versionName "1.1.0"

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK=src/main/jni/Application.mk"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.fragment:fragment:1.5.5'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
}
