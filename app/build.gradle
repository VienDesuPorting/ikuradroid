plugins {
    id 'com.android.application'
}

android {
    namespace 'su.viende.vile'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // 1.0.0 rebrand: applicationId moved su.viende.vile -> su.viende.ikuradroid.
        // The Java namespace above INTENTIONALLY stays su.viende.vile: the SDL JNI
        // bridge (SDL_JAVA_PACKAGE_PATH := su_viende_vile in jni/Android.mk),
        // org.libsdl.app.* references and Java package declarations all depend on
        // it. Renaming it would risk breaking the native bridge for zero benefit.
        applicationId "su.viende.ikuradroid"
        minSdk 21
        // 1.2.0: SAF-only storage - the app needs no storage permission on any
        // Android version (persisted ACTION_OPEN_DOCUMENT_TREE grant + the
        // app-private files dir for the game copies and savegames).
        targetSdk 35
        // Single source of truth for the version. NB: values here override
        // android:versionCode/versionName in AndroidManifest.xml — keep the
        // manifest attributes removed to avoid silent mismatches.
        // 1.0.0 restarts both versionName and the versionCode lineage: the new
        // applicationId makes it a fresh install, there is no upgrade path from
        // the 0.54.x line (su.viende.vile).
        versionCode 4
        versionName "1.2.0"

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK=src/main/jni/Application.mk"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 1.2.0 dependency diet: viewpager / fragment / preference / cardview
    // (2011-era or unused) are gone together with the old folder browser.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
