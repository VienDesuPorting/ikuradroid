plugins {
    id 'com.android.application'
}

android {
    namespace 'su.viende.vile'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "su.viende.vile"
        minSdk 21
        // 35 breaks the 2016-era file browser permission model less than expected:
        // WRITE_EXTERNAL_STORAGE still grants access to shared storage roots via
        // MANAGE_EXTERNAL_STORAGE below, and app-private dirs always work.
        targetSdk 35
        // Single source of truth for the version. NB: values here override
        // android:versionCode/versionName in AndroidManifest.xml — keep the
        // manifest attributes removed to avoid silent mismatches.
        versionCode 4
        versionName "0.54.3-arm64"

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK=src/main/jni/Application.mk"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.fragment:fragment:1.5.5'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
}
