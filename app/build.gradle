plugins {
    id 'com.android.application'
}

android {
    namespace 'su.viende.ikuradroid'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "su.viende.ikuradroid"
        minSdk 24
        targetSdk 35
        // The only place the version is defined; the manifest carries no
        // version attributes of its own.
        versionCode 24
        versionName "2.0.6"

        externalNativeBuild {
            ndkBuild {
                arguments "NDK_APPLICATION_MK=src/main/jni/Application.mk"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    signingConfigs {
        release {
            // Optional release signing: set IKURA_STORE_FILE, IKURA_STORE_PASSWORD,
            // IKURA_KEY_ALIAS, IKURA_KEY_PASSWORD in ~/.gradle/gradle.properties
            // (or configure signing in Android Studio). No credentials ship with
            // the repository; without them the release build uses the debug key.
            if (project.hasProperty('IKURA_STORE_FILE')) {
                storeFile rootProject.file(project.property('IKURA_STORE_FILE'))
                storePassword project.property('IKURA_STORE_PASSWORD')
                keyAlias project.property('IKURA_KEY_ALIAS')
                keyPassword project.property('IKURA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig project.hasProperty('IKURA_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
}
