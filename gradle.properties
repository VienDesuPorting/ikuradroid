# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Enabled caching to speed up ndk-build rebuilds
org.gradle.caching=true

# Release signing is configured locally, not in the repository: put
# IKURA_STORE_FILE / IKURA_STORE_PASSWORD / IKURA_KEY_ALIAS /
# IKURA_KEY_PASSWORD into ~/.gradle/gradle.properties (or set up signing
# in Android Studio). Without them release builds use the debug key.
